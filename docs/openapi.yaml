          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid JWT authorization token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Signed in, but the account does not have the ROLE_ADMIN role this operation needs
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RegisterRequest:
      type: object
      required:
        - fullName
        - email
        - password
      properties:
        fullName:
          type: string
          example: Jane Doe
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: SecurePass123!
        phoneNumber:
          type: string
          example: "+1-555-0199"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: jane.doe@example.com
        password:
          type: string
          example: SecurePass123!

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokenType:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 101
        fullName:
          type: string
          example: Jane Doe
        email:
          type: string
          example: jane.doe@example.com
        phoneNumber:
          type: string
          example: "+1-555-0199"
        giftPointsBalance:
          type: integer
          example: 250
        createdAt:
          type: string
          format: date-time

    Address:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        recipientName:
          type: string
          example: Jane Doe
        streetAddress:
          type: string
          example: 77 Massachusetts Ave
        city:
          type: string
          example: Cambridge
        state:
          type: string
          example: MA
        postalCode:
          type: string
          example: "02139"
        country:
          type: string
          example: United States
        isDefault:
          type: boolean
          example: true

    AddressRequest:
      type: object
      required:
        - recipientName
        - email
        - phoneNumber
        - streetAddress
        - city
        - state
        - postalCode
        - country
      properties:
        recipientName:
          type: string
          example: Asha Verma
        email:
          type: string
          format: email
          example: asha@example.com
        phoneNumber:
          type: string
          example: "+91 98765 43210"
        streetAddress:
          type: string
          example: 12 MG Road
        addressLine2:
          type: string
          nullable: true
          example: Floor 3
        city:
          type: string
          example: Pune
        state:
          type: string
          example: Maharashtra
        postalCode:
          type: string
          description: PIN code
          example: "411001"
        country:
          type: string
          example: India
        isDefault:
          type: boolean
          default: false

    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Cloud & DevOps
        slug:
          type: string
          example: cloud-devops
        description:
          type: string
          example: Architecture, containers, Kubernetes, cloud native engineering.
        bookCount:
          type: integer
          example: 12

    Publisher:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: O'Reilly Media
        code:
          type: string
          example: OREILLY
        website:
          type: string
          example: https://www.oreilly.com

    BookSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Cloud Native Spring in Action
        author:
          type: string
          example: Thomas Vitale
        isbn:
          type: string
          example: "9781617298813"
        price:
          type: number
          format: double
          example: 49.99
        originalPrice:
          type: number
          format: double
          example: 59.99
        rating:
          type: number
          format: float
          example: 4.8
        reviewCount:
          type: integer
          example: 124
        coverImageUrl:
          type: string
          example: /images/books/cloud-native-spring.jpg
        categoryName:
          type: string
          example: Cloud & DevOps
        publisherName:
          type: string
          example: Manning Publications
        inStock:
          type: boolean
          example: true
        stockQuantity:
          type: integer
          example: 35
        tentativeDeliveryDays:
          type: integer
          example: 2

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookSummary'
        - type: object
          properties:
            description:
              type: string
              example: Practical guide to building production-ready containerized microservices.
            publishedYear:
              type: integer
              example: 2023
            pageCount:
              type: integer
              example: 520
            language:
              type: string
              example: English
            tentativeDeliveryDate:
              type: string
              format: date
              example: "2026-11-06"
            category:
              $ref: '#/components/schemas/Category'
            publisher:
              $ref: '#/components/schemas/Publisher'

    BookPageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        totalElements:
          type: integer
          example: 45
        totalPages:
          type: integer
          example: 4
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 12

    CartItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        book:
          $ref: '#/components/schemas/BookSummary'
        quantity:
          type: integer
          example: 2
        unitPrice:
          type: number
          format: double
          example: 49.99
        subtotal:
          type: number
          format: double
          example: 99.98

    CartResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 5
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        itemCount:
          type: integer
          example: 2
        subtotal:
          type: number
          format: double
          example: 99.98
        estimatedTax:
          type: number
          format: double
          example: 8.00
        shippingFee:
          type: number
          format: double
          example: 0.00
        totalAmount:
          type: number
          format: double
          example: 107.98

    AddToCartRequest:
      type: object
      required:
        - bookId
        - quantity
      properties:
        bookId:
          type: integer
          format: int64
          example: 1
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3

    PlaceOrderRequest:
      type: object
      required:
        - addressId
        - paymentMethod
      properties:
        addressId:
          type: integer
          format: int64
          example: 1
        paymentMethod:
          type: string
          enum: [CREDIT_CARD, DEBIT_CARD, UPI, WALLET]
          example: CREDIT_CARD
        cardNumber:
          type: string
          description: Validated with the Luhn check, never stored. Test card 4242 4242 4242 4242 succeeds; 4000 0000 0000 0002 is declined.
          example: "4242 4242 4242 4242"
        cardName:
          type: string
          example: Asha Verma
        cardExpiry:
          type: string
          description: MM/YY, must not be in the past
          example: "12/30"
        cardCvv:
          type: string
          description: 3 or 4 digits, never stored
          example: "123"
        upiId:
          type: string
          description: Required for UPI, in the form name@bank
          example: asha@okbank
        couponCode:
          type: string
          nullable: true
          example: WELCOME10
        pointsToRedeem:
          type: integer
          description: Points to redeem (1 point = 1 rupee off)
          default: 0
          example: 50

    OrderItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        bookId:
          type: integer
          format: int64
        bookTitle:
          type: string
        bookAuthor:
          type: string
        coverImageUrl:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        totalPrice:
          type: number
          format: double
        refundedQuantity:
          type: integer
          description: Units already refunded (removed from the order or returned).

    OrderSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        orderNumber:
          type: string
          example: BK-20261104-8921
        orderStatus:
          type: string
          enum: [CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, RETURNED]
          example: CONFIRMED
        paymentStatus:
          type: string
          enum: [PAID, PARTIALLY_REFUNDED, REFUNDED, FAILED]
          example: PAID
        totalAmount:
          type: number
          format: double
          example: 102.98
        pointsRedeemed:
          type: integer
          example: 50
        pointsDiscount:
          type: number
          format: double
          example: 5.00
        pointsEarned:
          type: integer
          example: 10
        itemCount:
          type: integer
          example: 2
        createdAt:
          type: string
          format: date-time
        estimatedDeliveryDate:
          type: string
          format: date
          example: "2026-11-07"
        canCancel:
          type: boolean
          description: True if order is within 48 hours of creation and status is CONFIRMED
          example: true
        hoursRemainingToCancel:
          type: number
          format: double
          example: 47.5
        refundedAmount:
          type: number
          format: double
          description: Cash refunded so far (partial refunds from order changes and returns, or the full refund on cancellation).
          example: 0
        shippingZone:
          type: string
          enum: [LOCAL, REGIONAL, NATIONAL]
          nullable: true
        shipmentStatus:
          type: string
          enum: [PROCESSING, SHIPPED, DELIVERED, CANCELLED]
          nullable: true
        canModify:
          type: boolean
          description: True while the order has not shipped, is inside the modification window and has more than one book left.
        canReturn:
          type: boolean
          description: True once delivered, inside the store's return window, with books still returnable.
        returnDeadline:
          type: string
          format: date
          nullable: true

    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          properties:
            deliveryAddress:
              $ref: '#/components/schemas/Address'
            paymentMethod:
              type: string
              example: CREDIT_CARD
            cardLast4:
              type: string
              example: "4242"
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItemResponse'
            subtotal:
              type: number
              format: double
            tax:
              type: number
              format: double
            shippingFee:
              type: number
              format: double
            carrier:
              type: string
              nullable: true
            trackingNumber:
              type: string
              nullable: true

    OrderConfirmation:
      type: object
      properties:
        orderId:
          type: integer
          format: int64
          example: 1001
        orderNumber:
          type: string
          example: BK-20261104-8921
        orderStatus:
          type: string
          example: CONFIRMED
        paymentStatus:
          type: string
          example: PAID
        totalAmount:
          type: number
          format: double
          example: 102.98
        pointsRedeemed:
          type: integer
          example: 50
        pointsEarned:
          type: integer
          example: 10
        newGiftPointsBalance:
          type: integer
          example: 210
        estimatedDeliveryDate:
          type: string
          format: date
          example: "2026-11-07"
        message:
          type: string
          example: "Payment successful and order confirmed! Your books are being prepared for dispatch."

    CancelOrderRequest:
      type: object
      properties:
        reason:
          type: string
          example: "Accidental purchase, ordered wrong edition."

    GiftPointsSummary:
      type: object
      properties:
        currentBalance:
          type: integer
          example: 210
        pointValueRate:
          type: string
          example: "10 points = $1.00 USD"
        history:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              points:
                type: integer
                example: 10
              type:
                type: string
                enum: [EARNED, REDEEMED, REFUNDED]
                example: EARNED
              description:
                type: string
                example: "Earned from Order #BK-20261104-8921"
              createdAt:
                type: string
                format: date-time

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: "Order cannot be cancelled as 48 hours have elapsed."
        path:
          type: string
          example: /api/v1/orders/1001/cancel

    Facets:
      type: object
      properties:
        languages:
          type: array
          items:
            type: string
        formats:
          type: array
          items:
            type: string

    Shelves:
      type: object
      properties:
        bestsellers:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        newLaunches:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        topRated:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    ReviewRequest:
      type: object
      required: [rating, comment]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          maxLength: 100
          example: Clear and practical.

    Review:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userName:
          type: string
        rating:
          type: integer
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    Writer:
      type: object
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        bio:
          type: string
        photoUrl:
          type: string
          nullable: true
        following:
          type: boolean

    AuthorSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        photoUrl:
          type: string
          nullable: true
        bookCount:
          type: integer
        following:
          type: boolean

    AuthorDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        bio:
          type: string
        photoUrl:
          type: string
          nullable: true
        following:
          type: boolean
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    Wallet:
      type: object
      properties:
        balance:
          type: number
          example: 1500.00
        transactions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              amount:
                type: number
                description: Positive for money in (top-up, refund), negative for a payment
              type:
                type: string
                enum: [TOP_UP, PAYMENT, REFUND]
              description:
                type: string
              createdAt:
                type: string
                format: date-time

    Coupon:
      type: object
      properties:
        code:
          type: string
          example: WELCOME10
        description:
          type: string
        discount:
          type: number
          nullable: true
          description: Rupee discount on the current basket (only set by /coupons/validate)

    Quote:
      type: object
      properties:
        subtotal:
          type: number
        couponDiscount:
          type: number
        couponCode:
          type: string
          nullable: true
        tax:
          type: number
        shippingFee:
          type: number
        pointsDiscount:
          type: number
        pointsApplied:
          type: integer
        maxPoints:
          type: integer
        payable:
          type: number
        pointsToEarn:
          type: integer
        walletBalance:
          type: number
        walletCoversTotal:
          type: boolean
        shippingZone:
          type: string
          enum: [LOCAL, REGIONAL, NATIONAL]
          description: Zone of the chosen address (REGIONAL when no address was given).
        estimatedDeliveryDate:
          type: string
          format: date

    # ---------------- v3 ----------------
    StorePolicy:
      type: object
      properties:
        id: {type: integer, format: int64}
        type: {type: string, enum: [CANCELLATION, RETURN, SHIPPING, PRIVACY, PAYMENT, OTHER]}
        title: {type: string}
        body: {type: string}

    Store:
      type: object
      properties:
        id: {type: integer, format: int64}
        name: {type: string, example: Book Worm}
        tagline: {type: string, nullable: true}
        currency: {type: string, example: INR}
        returnWindowDays: {type: integer, example: 7}
        active: {type: boolean}
        policies:
          type: array
          items: {$ref: '#/components/schemas/StorePolicy'}

    StoreRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 150}
        tagline: {type: string, maxLength: 255}
        returnWindowDays: {type: integer, minimum: 0, maximum: 90}

    PolicyRequest:
      type: object
      required: [type, title, body]
      properties:
        type: {type: string, enum: [CANCELLATION, RETURN, SHIPPING, PRIVACY, PAYMENT, OTHER]}
        title: {type: string, maxLength: 150}
        body: {type: string, maxLength: 4000}

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: {type: string, maxLength: 100}
        description: {type: string, maxLength: 1000}
        visibility:
          type: string
          enum: [PUBLIC, MEMBERS]
          default: PUBLIC
          description: MEMBERS hides the category, and every book in it, from guests.

    BookRequest:
      type: object
      required: [title, author, isbn, categoryId, publisherId, price, stockQuantity, description, publishedYear, pageCount]
      properties:
        title: {type: string, maxLength: 255}
        author: {type: string, maxLength: 255}
        isbn: {type: string, maxLength: 20}
        categoryId: {type: integer, format: int64}
        publisherId: {type: integer, format: int64}
        authorId: {type: integer, format: int64, nullable: true}
        price: {type: number, minimum: 0.01}
        originalPrice: {type: number, minimum: 0.01, description: Defaults to the price. Cannot be lower than the price.}
        stockQuantity: {type: integer, minimum: 0}
        description: {type: string, maxLength: 4000}
        publishedYear: {type: integer, minimum: 1900, maximum: 2100}
        pageCount: {type: integer, minimum: 1}
        language: {type: string, default: English}
        format: {type: string, default: Paperback}
        tentativeDeliveryDays: {type: integer, minimum: 1, maximum: 30, default: 2}
        featured: {type: boolean}

    StockUpdate:
      type: object
      required: [stockQuantity]
      properties:
        stockQuantity: {type: integer, minimum: 0}

    ShipmentUpdate:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [SHIPPED, DELIVERED]}

    AdminOverview:
      type: object
      properties:
        orders: {type: integer}
        customers: {type: integer}
        books: {type: integer}
        openReturns: {type: integer}
        revenue: {type: number, description: Money received minus money refunded.}

    AdminOrderRow:
      type: object
      properties:
        id: {type: integer, format: int64}
        orderNumber: {type: string}
        customerEmail: {type: string}
        status: {type: string}
        paymentStatus: {type: string}
        totalAmount: {type: number}
        createdAt: {type: string, format: date-time}

    ShippingQuoteRequest:
      type: object
      required: [city, state]
      properties:
        city: {type: string, example: Delhi}
        state: {type: string, example: Delhi}
        subtotal: {type: number, nullable: true, description: Basket value, to see whether delivery would be free.}

    ShippingQuote:
      type: object
      properties:
        zone: {type: string, enum: [LOCAL, REGIONAL, NATIONAL]}
        fee: {type: number, example: 79}
        freeDelivery: {type: boolean}
        freeDeliveryThreshold: {type: number, example: 499}
        extraTransitDays: {type: integer}
        carrier: {type: string, example: Delhivery Surface}

    TrackingEvent:
      type: object
      properties:
        status: {type: string, enum: [ORDER_PLACED, LABEL_CREATED, SHIPPED, DELIVERED, CANCELLED]}
        description: {type: string}
        at: {type: string, format: date-time}

    Shipment:
      type: object
      properties:
        id: {type: integer, format: int64}
        orderId: {type: integer, format: int64}
        carrier: {type: string}
        trackingNumber: {type: string}
        status: {type: string, enum: [PROCESSING, SHIPPED, DELIVERED, CANCELLED]}
        shippingZone: {type: string, enum: [LOCAL, REGIONAL, NATIONAL], nullable: true}
        shippingFee: {type: number}
        estimatedDeliveryDate: {type: string, format: date}
        shippedAt: {type: string, format: date-time, nullable: true}
        deliveredAt: {type: string, format: date-time, nullable: true}
        events:
          type: array
          items: {$ref: '#/components/schemas/TrackingEvent'}

    ItemRemoval:
      type: object
      required: [orderItemId, quantity]
      properties:
        orderItemId: {type: integer, format: int64}
        quantity: {type: integer, minimum: 1}

    ModifyOrderRequest:
      type: object
      description: Either field may be omitted, but not both.
      properties:
        addressId: {type: integer, format: int64, nullable: true}
        removeItems:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/ItemRemoval'}

    ReturnLine:
      type: object
      required: [orderItemId, quantity]
      properties:
        orderItemId: {type: integer, format: int64}
        quantity: {type: integer, minimum: 1}

    ReturnRequest:
      type: object
      required: [items, reason]
      properties:
        items:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/ReturnLine'}
        reason: {type: string, maxLength: 300}

    ReturnLineResponse:
      type: object
      properties:
        orderItemId: {type: integer, format: int64}
        bookTitle: {type: string}
        quantity: {type: integer}
        value: {type: number}

    ReturnResponse:
      type: object
      properties:
        id: {type: integer, format: int64}
        rmaNumber: {type: string, example: RMA-20261119-482113}
        orderId: {type: integer, format: int64}
        orderNumber: {type: string}
        status: {type: string, enum: [REQUESTED, PICKED_UP, REFUNDED, REJECTED]}
        reason: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/ReturnLineResponse'}
        estimatedRefund: {type: number, description: What the customer can expect; the final figure is fixed when the refund is processed.}
        refundAmount: {type: number, nullable: true, description: Null until the refund is paid.}
        refundReference: {type: string, nullable: true}
        pointsRefunded: {type: integer}
        pointsRevoked: {type: integer}
        returnCarrier: {type: string}
        returnTrackingNumber: {type: string}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time, nullable: true}
        adminNote: {type: string, nullable: true}
        message: {type: string, nullable: true}

    ReturnableLine:
      type: object
      properties:
        orderItemId: {type: integer, format: int64}
        bookTitle: {type: string}
        maxQuantity: {type: integer}
        unitPrice: {type: number}

    ReturnEligibility:
      type: object
      properties:
        eligible: {type: boolean}
        reason: {type: string, nullable: true, description: Why the order cannot be returned, when eligible is false.}
        returnDeadline: {type: string, format: date, nullable: true}
        lines:
          type: array
          items: {$ref: '#/components/schemas/ReturnableLine'}

    AdminReturnAction:
      type: object
      properties:
        note: {type: string, maxLength: 300}

    Suggestions:
      type: object
      properties:
        upsell:
          type: array
          items: {$ref: '#/components/schemas/BookSummary'}
        crossSell:
          type: array
          items: {$ref: '#/components/schemas/BookSummary'}

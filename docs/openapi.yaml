openapi: 3.0.3
info:
  title: E-Bookstore Platform API
  description: |
    Comprehensive RESTful API for the AI Specialist Capstone E-Bookstore Platform.
    Synthesized and refined using IBM Bob Agentic IDE workflows.
    Includes full e-commerce lifecycle: authentication, catalog browsing, intelligent recommendations,
    shopping cart, gift points redemption, order placement, and 48-hour order cancellation.

    v2 adds the wireframe features: catalog filters (language, format, price) and landing shelves,
    wishlist, followed writers, reviews, wallet, coupons and a server-side order quote.
    All money is in Indian rupees (INR): 12% tax, free delivery from 499, 1 gift point = 1 rupee.

    v3 adds the back-office and after-sales requirements from the architecture slide (slide 4):
    guest vs member entitlements, roles, logout, stores and store policies, catalogue administration,
    shipments with zone-based delivery rates and tracking, order modification, returns with refunds,
    and up-sell / cross-sell suggestions.

    **Who can call what**
    - *Guest* (no token): browse the public catalogue, writers, coupons, store policies, delivery rate quotes.
    - *Member* (any signed-in customer): everything above, plus members-only categories, basket, orders, returns.
    - *Administrator* (`ROLE_ADMIN`): everything under `/admin`. A signed-in customer gets 403, a guest gets 401.

    Members-only books are invisible to guests: a direct request for one returns 404, not 403, so its existence is not revealed.
  version: 3.0.0
  contact:
    name: Cloud FullStack AI Engineering Team
    email: capstone@ibm-specialist.example.com
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  # ==================== AUTHENTICATION & USERS ====================
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new customer
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Authenticate customer and obtain JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current authenticated user profile
      operationId: getCurrentUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/addresses:
    get:
      tags:
        - User Addresses
      summary: Get all saved delivery addresses for authenticated customer
      operationId: getUserAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of saved addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - User Addresses
      summary: Add a new delivery address
      operationId: addAddress
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
      responses:
        '201':
          description: Address successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/points:
    get:
      tags:
        - Loyalty & Gift Points
      summary: Get customer gift points balance and transaction history
      operationId: getGiftPoints
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gift points summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftPointsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== CATALOG & BOOKS ====================
  /categories:
    get:
      tags:
        - Catalog
      summary: List all book categories
      operationId: getCategories
      responses:
        '200':
          description: Array of product categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

  /publishers:
    get:
      tags:
        - Catalog
      summary: List all publishers / brands
      operationId: getPublishers
      responses:
        '200':
          description: Array of publishers/brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Publisher'

  /books:
    get:
      tags:
        - Books
      summary: Search and filter book catalog
      operationId: searchBooks
      parameters:
        - name: query
          in: query
          description: Keyword search on title, author, or description
          schema:
            type: string
        - name: categoryId
          in: query
          description: Filter by category ID
          schema:
            type: integer
            format: int64
        - name: publisherId
          in: query
          description: Filter by publisher / brand ID
          schema:
            type: integer
            format: int64
        - name: language
          in: query
          description: Exact language, for example English (see /books/facets)
          schema:
            type: string
        - name: format
          in: query
          description: Exact format, for example Paperback, Hardcover or eBook (see /books/facets)
          schema:
            type: string
        - name: minPrice
          in: query
          description: Minimum price in rupees
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [featured, price_asc, price_desc, rating_desc, title_asc, newest, bestselling]
            default: featured
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 12
      responses:
        '200':
          description: Paginated book list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPageResponse'

  /books/{id}:
    get:
      tags:
        - Books
      summary: Get detailed book information by ID
      operationId: getBookById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Book detail with tentative delivery date calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{id}/related:
    get:
      tags:
        - Books
      summary: Get related books in the same genre or by same author
      operationId: getRelatedBooks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: limit
          in: query
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: List of related books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'

  # ==================== RECOMMENDATIONS ====================
  /recommendations/history:
    get:
      tags:
        - Recommendations
      summary: Get personalized recommendations based on customer order history
      operationId: getHistoryRecommendations
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: List of recommended books based on prior purchases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== SHOPPING CART ====================
  /cart:
    get:
      tags:
        - Cart
      summary: Retrieve current active shopping cart
      operationId: getCart
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current cart contents and pricing calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Cart
      summary: Add an item or update quantity in cart
      operationId: addToCart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddToCartRequest'
      responses:
        '200':
          description: Updated cart state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
        - Cart
      summary: Clear entire shopping cart
      operationId: clearCart
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared

  /cart/items/{itemId}:
    put:
      tags:
        - Cart
      summary: Update cart item quantity
      operationId: updateCartItemQuantity
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Cart
      summary: Remove a specific item from cart
      operationId: removeCartItem
      security:
        - bearerAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Updated cart after removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== ORDERS & CHECKOUT ====================
  /orders:
    post:
      tags:
        - Orders & Checkout
      summary: Place order and initiate payment with optional gift points redemption
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed and payment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags:
        - Orders & Checkout
      summary: Get order history for customer (supports Buy It Again)
      operationId: getOrderHistory
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of historical customer orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}:
    get:
      tags:
        - Orders & Checkout
      summary: Get order details by ID
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detailed order state, line items, delivery date, cancellation eligibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Order Lifecycle
      summary: "Modify an order before it ships"
      operationId: modifyOrder
      description: |
        Change the delivery address and/or take books off the order. Allowed only while the order is CONFIRMED or PROCESSING,
        the parcel has not been handed to the carrier, and the modification window (24 hours by default) is open.
        
        Removed books are refunded: their price, their share of the tax and coupon, and their share of the gift points spent.
        Delivery is refunded only if the whole order is cancelled, so the last book cannot be removed (cancel the order instead).
        A new address in a farther delivery zone than the one paid for is refused.
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModifyOrderRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/cancel:
    post:
      tags:
        - Orders & Checkout
      summary: Cancel an order within 48 hours of purchase
      description: |
        Business Rule: Customers can cancel an order within 48 hours of placing it, as long as it has not shipped.
        Refunds whatever is still outstanding (so a partial refund from an earlier order change is not paid twice),
        restores redeemed gift points, revokes earned points and restocks the books. After delivery, use a return instead.
      operationId: cancelOrder
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled successfully within 48-hour window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderConfirmation'
        '400':
          description: Order cancellation window expired (>48h) or already shipped/cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/reorder:
    post:
      tags:
        - Orders & Checkout
      summary: "Buy It Again: 1-click re-add order items into active shopping cart"
      operationId: buyItAgain
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Items re-added to cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
        '404':
          $ref: '#/components/responses/NotFound'

# ==================== DATA COMPONENTS & SCHEMAS ====================
  # ==================== CATALOG: FACETS & SHELVES ====================
  /books/facets:
    get:
      tags:
        - Books
      summary: Languages and formats available as catalog filters
      operationId: getFacets
      responses:
        '200':
          description: Filter values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facets'

  /books/shelves:
    get:
      tags:
        - Books
      summary: Landing page shelves (bestsellers, new launches, top rated)
      operationId: getShelves
      parameters:
        - name: limit
          in: query
          description: Books per shelf
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: Three shelves of book summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shelves'

  /books/{id}/reviews:
    post:
      tags:
        - Books
      summary: Post a review (one per customer per book)
      operationId: addReview
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '201':
          description: Review saved; the book's rating and review count are updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== WISHLIST & WRITERS ====================
  /wishlist:
    get:
      tags:
        - Wishlist & Writers
      summary: My Wishlist
      operationId: getWishlist
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wishlisted books, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wishlist/{bookId}:
    put:
      tags:
        - Wishlist & Writers
      summary: Add a book to the wishlist (idempotent)
      operationId: addToWishlist
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Book is on the wishlist
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Wishlist & Writers
      summary: Remove a book from the wishlist
      operationId: removeFromWishlist
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Book is no longer on the wishlist

  /writers:
    get:
      tags:
        - Wishlist & Writers
      summary: Writers (My Writers when followed=true, which needs a token)
      operationId: getWriters
      parameters:
        - name: followed
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Writers with book counts and the caller's follow state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthorSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /writers/{id}:
    get:
      tags:
        - Wishlist & Writers
      summary: Writer profile with their books
      operationId: getWriter
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Writer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /writers/{id}/follow:
    put:
      tags:
        - Wishlist & Writers
      summary: Follow a writer (idempotent)
      operationId: followWriter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Now following
    delete:
      tags:
        - Wishlist & Writers
      summary: Unfollow a writer
      operationId: unfollowWriter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: No longer following

  # ==================== WALLET & COUPONS ====================
  /wallet:
    get:
      tags:
        - Wallet & Coupons
      summary: Wallet balance and transactions
      operationId: getWallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance and ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /wallet/top-up:
    post:
      tags:
        - Wallet & Coupons
      summary: Add money to the wallet (simulated, no real payment is taken)
      operationId: topUpWallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  minimum: 1
                  maximum: 50000
                  example: 500
      responses:
        '200':
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'

  /coupons:
    get:
      tags:
        - Wallet & Coupons
      summary: Active coupon codes
      operationId: listCoupons
      responses:
        '200':
          description: Codes and descriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Coupon'

  /coupons/validate:
    post:
      tags:
        - Wallet & Coupons
      summary: Check a coupon against the current basket
      operationId: validateCoupon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: WELCOME10
      responses:
        '200':
          description: Coupon applies; the rupee discount is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Coupon'
        '400':
          $ref: '#/components/responses/BadRequest'

  /orders/quote:
    post:
      tags:
        - Orders & Checkout
      summary: Price the basket with an optional coupon and gift points, without placing an order
      description: |
        Uses the same pricing code as order placement, so the total shown at checkout is the
        total that is charged. Requested points above the allowed maximum are capped, not rejected.
      operationId: quoteOrder
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                couponCode:
                  type: string
                  nullable: true
                addressId:
                  type: integer
                  format: int64
                  nullable: true
                  description: Delivery address. When given, the delivery charge and date use that address's zone.
                pointsToRedeem:
                  type: integer
                  example: 100
      responses:
        '200':
          description: Priced basket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ==================== v3: STORES, LIFECYCLE, ADMINISTRATION ====================
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: "Sign out and revoke the token"
      operationId: logoutUser
      description: |
        Revokes the presented token so it can no longer be used, even though it has not expired.
        Signing out twice, or with an already-expired token, is harmless and still returns 200.
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Signed out
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stores:
    get:
      tags:
        - Stores & Policies
      summary: "List the open stores with their policies"
      operationId: listStores
      description: |
        Public. Closed stores are not listed.
      responses:
        '200':
          description: Open stores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /stores/{id}:
    get:
      tags:
        - Stores & Policies
      summary: "Get one open store with its policies"
      operationId: getStore
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The store
          content:
            application/json:

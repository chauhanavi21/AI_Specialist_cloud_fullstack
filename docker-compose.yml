# Local stack: PostgreSQL + Spring Boot API + React (nginx).
#   docker compose up --build
# Open http://localhost:3000 (API docs: http://localhost:8080/api/v1/swagger-ui.html).
#
# Credentials come from the environment or a local .env file (never committed).
# The defaults below are for local demos only. Change them for anything shared.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: bookstoredb
      POSTGRES_USER: ${POSTGRES_USER:-bookstore_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    # No host port is published: only the backend container needs the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d bookstoredb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookstore-backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bookstoredb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookstore_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      # Set JWT_SECRET to a long random value (at least 32 bytes) for anything beyond a local demo.
      JWT_SECRET: ${JWT_SECRET:-4c617073746f6e6553757065725365637572654a57545369676e696e674b65793230323649424d426f625370656369616c697374}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bookstore-frontend
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstoredb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # The schema is created by db/postgres/schema.sql (idempotent), so Hibernate only validates it.
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: always
      # Postgres uses its own idempotent scripts: safe to run on every start, never drops data.
      schema-locations: classpath:db/postgres/schema.sql
      data-locations: classpath:db/postgres/data.sql

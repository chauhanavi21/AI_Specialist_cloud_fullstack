server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: bookstore-api
  profiles:
    active: dev
  datasource:
    url: jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

# App Security & Business Logic Configuration
app:
  jwt:
    secret: ${JWT_SECRET:4c617073746f6e6553757065725365637572654a57545369676e696e674b65793230323649424d426f625370656369616c697374}
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  loyalty:
    points-per-dollar-spent: 0.1 # 1 point per $10 spent
    dollars-per-point-redeemed: 0.10 # 10 points = $1.00 USD
  orders:
    cancellation-window-hours: 48

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

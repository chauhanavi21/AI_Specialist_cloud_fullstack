# Bookstore on Red Hat OpenShift (IBM ROKS or AWS ROSA).
#
#   oc apply -f deploy/k8s/bookstore-roks-deployment.yaml
#
# BEFORE you apply: replace every CHANGE_ME value in the Secret below. Do not commit real secrets;
# for anything beyond a demo create the Secret from the CLI instead:
#   oc create secret generic bookstore-secrets -n bookstore-capstone \
#     --from-literal=postgres-user=bookstore_user \
#     --from-literal=postgres-password="$(openssl rand -base64 24)" \
#     --from-literal=jwt-secret="$(openssl rand -hex 48)"
#
# Status: this manifest has been reviewed and checked for YAML validity, but it has not been applied
# to a live cluster from this repository.
apiVersion: v1
kind: Namespace
metadata:
  name: bookstore-capstone
---
apiVersion: v1
kind: Secret
metadata:
  name: bookstore-secrets
  namespace: bookstore-capstone
type: Opaque
stringData:
  postgres-user: "bookstore_user"
  postgres-password: "CHANGE_ME_postgres_password"
  jwt-secret: "CHANGE_ME_at_least_64_hex_characters_0000000000000000000000000000000000"
---
# PostgreSQL with persistent storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookstore-postgres
  namespace: bookstore-capstone
spec:
  serviceName: bookstore-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-postgres
  template:
    metadata:
      labels:
        app: bookstore-postgres
    spec:
      containers:
        - name: postgres
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_DATABASE
              value: bookstoredb
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: postgres-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: postgres-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d bookstoredb"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U $POSTGRESQL_USER -d bookstoredb"]
            initialDelaySeconds: 30
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-postgres
  namespace: bookstore-capstone
spec:
  selector:
    app: bookstore-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-backend
  namespace: bookstore-capstone
  labels:
    app: bookstore-backend
spec:
  # One replica: the Postgres seed/sequence reset runs at start-up, so a single instance seeds cleanly.
  replicas: 1
  selector:
    matchLabels:
      app: bookstore-backend
  template:
    metadata:
      labels:
        app: bookstore-backend
    spec:
      containers:
        - name: backend
          image: image-registry.openshift-image-registry.svc:5000/bookstore-capstone/bookstore-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "postgres"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://bookstore-postgres:5432/bookstoredb"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: postgres-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookstore-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-backend
  namespace: bookstore-capstone
spec:
  selector:
    app: bookstore-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookstore-frontend
  namespace: bookstore-capstone
  labels:
    app: bookstore-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bookstore-frontend
  template:
    metadata:
      labels:
        app: bookstore-frontend
    spec:
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/bookstore-capstone/bookstore-frontend:latest
          ports:
            - containerPort: 8080
          env:
            # nginx proxies /api/v1/ to this Service name
            - name: BACKEND_HOST
              value: bookstore-backend
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bookstore-frontend
  namespace: bookstore-capstone
spec:
  selector:
    app: bookstore-frontend
  ports:
    - port: 8080
      targetPort: 8080
---
# OpenShift Route for ROKS / ROSA ingress
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: bookstore-route
  namespace: bookstore-capstone
spec:
  to:
    kind: Service
    name: bookstore-frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
